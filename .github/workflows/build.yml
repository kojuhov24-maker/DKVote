          distribution: 'temurin'
          java-version: '17При первой сборке на GitHub Actions сбой обычно происходит на одном из двух шагов:

1. **Непринятые лицензии Android SDK**: сборка останавливается в ожидании подтверждения лицензионных соглашений Google.
2. **Конфликт версий Cython и Kivy**: если Cython обновился до версии 3.x, сборка падает с ошибками компиляции C-кода.

Отредактируйте файл рабочего процесса прямо на сайте GitHub:

1. Откройте страницу репозитория и перейдите по пути:
   `.github` → `workflows` → `build.yml`.
2. Нажмите на значок карандаша (**Edit this file**) в правом верхнем углу.
3. Полностью замените содержимое файла следующим сценарием:

```yaml
name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev lld

      - name: Install Python tools
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "Cython<3.0" buildozer

      - name: Build with Buildozer
        run: |
          yes | buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DKVote-Android-App
          path: bin/*.apk
